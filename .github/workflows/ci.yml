name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This job only checks out the repo and runs npm — it never writes issues, pull
# requests, packages, checks or deployments. Without this block the GITHUB_TOKEN
# would inherit the repository default, which is broader, on a public workflow
# that runs `npm ci` for fork pull requests.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # `npm ci` now downloads Playwright's headless shell from this package's
      # postinstall, so that a peer never has to install a browser by hand. These
      # tests exercise the comment tools only — no headless browser — so the
      # variable that turns that download off keeps this job as fast as it was.
      # bin/ensureBrowser.mjs honours it at run time too, which is what stops the
      # server from downloading a browser mid-test if one ever does need it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (server + UI)
        run: npm run typecheck

      - name: Build the workspace UI
        run: npm run build:ui

      - name: Test
        run: npm test
