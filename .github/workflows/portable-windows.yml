name: Portable Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install build dependencies
        run: npm ci
        env:
          # The postinstall would fetch the headless shell before the cache below
          # has been restored. "Fetch compiler payloads" already does it, after
          # the cache, and that is the copy build-portable.ps1 bundles.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Cache compiler payloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\ms-playwright
            ~\AppData\Local\texchronicle\busytex
            dist-portable\.cache
          key: texchronicle-portable-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Fetch compiler payloads
        shell: powershell
        run: |
          npx --no-install playwright install chromium --only-shell
          if (-not (Test-Path "$env:LOCALAPPDATA\texchronicle\busytex\busytex.wasm")) {
            node node_modules\texlyre-busytex\scripts\cli.cjs download-assets "$env:LOCALAPPDATA\texchronicle"
          }

      - name: Build and verify portable release
        shell: powershell
        run: .\scripts\build-portable.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeXChronicle-Portable-Windows-x64
          path: |
            dist-portable\TeXChronicle-*-Portable-Windows-x64.zip
            dist-portable\TeXChronicle-*-Portable-Windows-x64.zip.sha256
          compression-level: 0

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (gh release view $env:GITHUB_REF_NAME 2>$null)) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME dist-portable\TeXChronicle-*-Portable-Windows-x64.zip dist-portable\TeXChronicle-*-Portable-Windows-x64.zip.sha256 --clobber
